/* V3: home category cards use a fixed landscape 4:3 ratio. */
.stage.home{height:auto;aspect-ratio: 2.12 / 1;min-height:0;max-height:none;}
.home .dish{width:46%;height:auto;aspect-ratio:4 / 3;}
@media (orientation:portrait){.stage.home{height:auto;aspect-ratio:2.12 / 1;min-height:0}.home .dish{width:46%;height:auto;aspect-ratio:4 / 3;}}
@media (orientation:landscape){.stage.home{width:min(100%, calc((100vh - 150px) * 2.12));margin-inline:auto;height:auto;aspect-ratio:2.12 / 1;min-height:0;}.home .dish{width:46%;height:auto;aspect-ratio:4 / 3;}}

/* V4: large home carousel, responsive to device orientation. */
.stage.home{width:100%;height:clamp(220px,65vh,650px);height:clamp(220px,65dvh,650px);aspect-ratio:auto;min-height:0;max-height:none;margin-inline:auto;overflow:hidden}
.home .dish{width:77%;height:96%;aspect-ratio:auto}
@media (orientation:landscape){.stage.home{width:100%;height:clamp(150px,calc(100vh - 160px),650px);height:clamp(150px,calc(100dvh - 160px),650px);aspect-ratio:auto}.home .dish{width:min(62%,calc((100vh - 160px) * 1.28));height:96%;aspect-ratio:auto}}

/* V6: continuous flight, independent of carousel */
.flight svg{filter:blur(3.5px);transform:scale(1.06)}
.flight .clouds{animation:flightClouds 14s linear infinite;will-change:transform;transform-box:view-box}
.flight .water{animation:flightSea 3.5s linear infinite;will-change:transform;transform-box:view-box}
.flight .wing-motion{animation:flightWing 5s ease-in-out infinite alternate;transform-origin:100% 85%;transform-box:view-box;will-change:transform}
.flight .sun-motion{animation:flightSun 7s ease-in-out infinite alternate;transform-origin:80% 16%;transform-box:view-box}
.flight:after{background:linear-gradient(180deg,#061a3c20,#061a3c15 45%,#061a3c65)}
@keyframes flightClouds{from{transform:translateX(0px)}to{transform:translateX(-770px)}}
@keyframes flightSea{from{transform:translateX(0px)}to{transform:translateX(-120px)}}
@keyframes flightWing{from{transform:translateY(-3px) rotate(-.35deg)}to{transform:translateY(5px) rotate(.35deg)}}
@keyframes flightSun{from{opacity:.78}to{opacity:1}}

/* V8: match the inner dish size on portrait; landscape 4:3. */
.stage.home{width:100%;height:clamp(220px,65vh,650px);height:clamp(220px,65dvh,650px);aspect-ratio:auto;overflow:hidden}
.home .dish{width:77%;height:96%;aspect-ratio:auto}
@media(orientation:landscape){.stage.home{height:calc(100vh - 145px);height:calc(100dvh - 145px);min-height:150px;max-height:650px}.home .dish{width:min(77%,calc((100vh - 145px)*1.28));width:min(77%,calc((100dvh - 145px)*1.28));height:96%;aspect-ratio:4/3}}
