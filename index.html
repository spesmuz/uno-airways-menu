/* V6: continuous flight, independent of carousel */
.flight svg{filter:blur(3.5px);transform:scale(1.06)}
.flight .clouds{animation:flightClouds 14s linear infinite;will-change:transform;transform-box:view-box}
.flight .water{animation:flightSea 3.5s linear infinite;will-change:transform;transform-box:view-box}
.flight .wing-motion{animation:flightWing 5s ease-in-out infinite alternate;transform-origin:100% 85%;transform-box:view-box;will-change:transform}
.flight .sun-motion{animation:flightSun 7s ease-in-out infinite alternate;transform-origin:80% 16%;transform-box:view-box}
.flight:after{background:linear-gradient(180deg,#061a3c20,#061a3c15 45%,#061a3c65)}
@keyframes flightClouds{from{transform:translateX(0px)}to{transform:translateX(-770px)}}

@keyframes flightSun{from{opacity:.78}to{opacity:1}}
