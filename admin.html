unction rows(){const q=$('search').value.toLowerCase();$('items').innerHTML=list.filter(x=>x.uz.toLowerCase().includes(q)).map(x=>`<article class="${x.active===false?'muted':''}">${safe(x.image)?`<img src="${safe(x.image)}" alt="">`:''}<div class="info"><strong>${esc(x.uz)}</strong><p>${tab==='d'?money(x.price)+' · '+esc(db.categories.find(c=>c.id===x.category)?.uz):''} ${x.active===false?' · Yashirilgan':''}</p></div><div class="actions"><button data-edit="${esc(x.id)}">Tahrirlash</button><button data-toggle="${esc(x.id)}">${x.active===false?'Ko‘rsatish':'Yashirish'}</button><button data-up="${esc(x.id)}">↑</button><button data-del="${esc(x.id)}">O‘chirish</button></div></article>`).join('')||'<p>Ma’lumot topilmadi.</p>'}rows();$('search').oninput=rows;$('add').onclick=()=>edit();$('items').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=Object.values(b.dataset)[0],x=list.find(y=>y.id===id);if(!x)return;if(b.dataset.edit)return edit(x);if(b.dataset.toggle)x.active=x.active===false;else if(b.dataset.up){const i=list.indexOf(x);if(i>0)[list[i-1],list[i]]=[list[i],list[i-1]]}else if(b.dataset.del){if(tab==='c'&&db.dishes.some(d=>d.category===id)){alert('Avval ushbu bo‘limdagi taomlarni ko‘chiring yoki o‘chiring.');return}if(!confirm('O‘chirilsinmi?'))return;list.splice(list.indexOf(x),1)}await save()}}
